[tool.poetry]
name = "unihra"
version = "1.3.1"
description = "Official Python Client for Unihra API"
authors = ["Unihra Team <dev@unihra.ru>"]
readme = "README.md"
license = "MIT"
homepage = "https://unihra.ru"
repository = "https://github.com/Unihra/unihra_sdk"
keywords = ["unihra", "seo", "api", "sdk", "semantic analysis"]
packages = [{include = "unihra", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
requests = "^2.31.0"
pandas = {version = "^2.0.0", optional = true}
openpyxl = {version = "^3.1.0", optional = true}
tqdm = {version = "^4.66.0", optional = true}

[tool.poetry.extras]
full = ["pandas", "openpyxl", "tqdm"]
report = ["pandas", "openpyxl"]
cli = ["tqdm", "pandas", "openpyxl"]

[tool.poetry.scripts]
unihra = "unihra.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"